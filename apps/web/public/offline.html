<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · CaterOS</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        background: #0b1220;
        color: #f8fafc;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .badge {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #111a2e;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
      }
      h1 { font-size: 1.25rem; margin: 0; }
      p { color: #94a3b8; max-width: 22rem; margin: 0; line-height: 1.5; }
      button {
        margin-top: 0.5rem;
        background: #22c55e;
        color: #04210f;
        border: 0;
        border-radius: 10px;
        padding: 0.75rem 1.25rem;
        font-weight: 600;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="badge">🚚</div>
    <h1>You're offline</h1>
    <p>
      Your deliveries are saved on this device. Any status updates you make will
      sync automatically once you're back online.
    </p>
    <button onclick="location.reload()">Try again</button>
  </body>
</html>
